<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MNSO Security IDs</title>
  <style>
    body {
      font-family: 'Times New Roman', serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 30px;
    }

    h1 {
      font-family: 'Georgia', serif;
      text-decoration: underline;
      margin-bottom: 20px;
    }

    .input-section {
      margin-bottom: 30px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border: 2px solid #444;
      border-radius: 5px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-left: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #2a2a2a;
      color: #fff;
    }

    .card {
      width: 420px;
      padding: 25px;
      border-radius: 12px;
      background: repeating-linear-gradient(
        45deg,
        #fdfcf9,
        #fdfcf9 10px,
        #f7f6f3 10px,
        #f7f6f3 20px
      );
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      border: 2px solid #ccc;
      display: none;
      position: relative;
      font-family: 'Georgia', serif;
    }

    .serial {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      position: absolute;
      top: 10px;
      left: 15px;
      color: #444;
    }

    .title {
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
      text-decoration: underline;
    }

    .seal {
      display: block;
      margin: 15px auto;
      max-width: 120px;
    }

    .name {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>MNSO Security ID Verification</h1>

  <div class="input-section">
    <input type="text" id="idInput" placeholder="Enter your ID (e.g. A22A1)" />
    <button onclick="showCard()">Get ID Card</button>
  </div>

  <div id="card" class="card">
    <div class="serial" id="serial"></div>
    <div class="title">The MNSO Organization</div>
    <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Logo" class="seal" />
    <div class="name" id="name"></div>
    <img src="7C60C8A7-1997-4A86-BC77-122697B82929.png" alt="Chairman Seal" class="seal" />
  </div>

  <script>
    const members = {
      "A22A1": "Jansen Monk",
      "A22A2": "Krystal G.",
      "A22A3": "Kendel Martin",
      "A22A4": "Janathe L.",
      "A22A5": "Reece Wsn.",
      "A22A6": "Ross Lmb.",
      "A22A7": "Horner Milton",
      "A22A8": "Ella Shaw"
    };

    function showCard() {
      const id = document.getElementById("idInput").value.trim().toUpperCase();
      const card = document.getElementById("card");
      const nameField = document.getElementById("name");
      const serialField = document.getElementById("serial");

      if (members[id]) {
        nameField.textContent = members[id];
        serialField.textContent = id;
        card.style.display = "block";
      } else {
        card.style.display = "none";
        alert("Invalid ID. Please try again.");
      }
    }
  </script>
</body>
</html>
