<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MNSO Virtual ID Pass</title>

<style>
body{
margin:0;
font-family:"Segoe UI",system-ui;
background:linear-gradient(135deg,#0a0f1a,#1c1c1c);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

/* LOGIN BOX */
#loginBox{
background:#111;
padding:30px;
border-radius:15px;
text-align:center;
box-shadow:0 0 20px rgba(255,0,0,0.6);
}

#loginBox img{
max-width:80px;
margin-bottom:15px;
}

#loginBox input{
padding:10px;
border-radius:8px;
border:none;
width:180px;
text-align:center;
font-size:16px;
}

#loginBox button{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:8px;
background:red;
color:white;
font-weight:bold;
cursor:pointer;
}

/* CARD */
#idCard{
display:none;
width:420px;
height:260px;
border-radius:12px;
border:1.5px solid #444;
box-shadow:0 12px 30px rgba(0,0,0,0.6);
padding:20px;
position:relative;
overflow:hidden;
background:linear-gradient(180deg,#f7f4ef 0%,#efe9dc 100%);
color:#111;
}

#idCard::before{
content:"";
position:absolute;
inset:0;
background-image:url("467CAA93-8809-4A02-AFA2-1749C9D78610.png");
background-repeat:no-repeat;
background-position:center;
background-size:220px;
opacity:.06;
}

.card-header{
text-align:center;
font-family:Georgia,serif;
font-weight:700;
font-size:18px;
letter-spacing:2px;
margin-bottom:8px;
border-bottom:1px solid rgba(0,0,0,.12);
padding-bottom:6px;
text-transform:uppercase;
}

.serial-top{
position:absolute;
top:10px;
left:14px;
font-family:"Courier New",monospace;
font-weight:700;
}

.serial-bottom{
position:absolute;
bottom:10px;
right:14px;
font-family:"Courier New",monospace;
}

.logo{
position:absolute;
top:58px;
left:20px;
width:72px;
}

.seal{
position:absolute;
top:44px;
right:18px;
width:68px;
}

.card-info{
margin-left:110px;
margin-top:56px;
}

.signature{
position:absolute;
bottom:18px;
left:18px;
font-size:11px;
font-style:italic;
}

.qr{
position:absolute;
bottom:15px;
right:18px;
width:56px;
height:56px;
background:#fff;
border:1px solid #bbb;
display:flex;
align-items:center;
justify-content:center;
}

.center-bottom{
position:absolute;
bottom:-2px;
left:50%;
transform:translateX(-50%);
font-family:Georgia,serif;
font-size:13px;
font-weight:600;
}
</style>
</head>

<body>

<div id="loginBox">
<img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png">
<h2>MNSO Secure Access</h2>
<p>Enter Your ID Number</p>
<input type="password" id="idInput" placeholder="Enter ID"/>
<br>
<button onclick="checkID()">Access</button>
</div>

<div id="idCard">
<div class="serial-top" id="serialTop">A22A1</div>
<div class="card-header">The MNSO Organization</div>

<img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" class="logo">
<img src="7C60C8A7-1997-4A86-BC77-122697B82929.png" class="seal">

<div class="card-info">
<h2 id="memberName">Member Name</h2>
<p><strong>Title:</strong> Member</p>
<p><strong>ID Number:</strong> <span id="memberID">A22A1</span></p>
<p><strong>Expiration:</strong> 12/2026</p>
</div>

<div class="signature">Authorized by MNSO Chairman</div>
<div class="qr">QR</div>
<div class="serial-bottom" id="serialBottom">A22A1</div>
<div class="center-bottom" id="centerBottom">MNSO</div>
</div>

<script>

/* =========================
   MEMBERS DATABASE
========================= */

const members = {

"A22A1":{name:"Jansen Monk",title:"Chairman",disabled:false},
"A22A2":{name:"Krystal G.",title:"Member",disabled:true},
"A22A3":{name:"Kendel Martin",title:"Member",disabled:false},
"A22A4":{name:"Janathe L.",title:"Member",disabled:false},
"A22A5":{name:"Reece Wsn.",title:"Member",disabled:false},
"A22A6":{name:"Ross Lmb.",title:"Member",disabled:false},
"A22A7":{name:"Horner Milton",title:"Member",disabled:false},
"A22A8":{name:"Ella Shaw",title:"Member",disabled:false},

/* ✅ NEW TEMPORARY MEMBERS */
"B22A1":{name:"Jaquez Jones",title:"Temporary Member",disabled:false},
"B22A2":{name:"Dallas Harris",title:"Temporary Member",disabled:false},

"XX":{
name:"Ole H. Frostad",
title:"Chapter Leader (Møre og Romsdal)",
bottomText:"MNSO Norway",
disabled:false
}

};

/* =========================
   AUDIT LOG
========================= */

const auditLog=[];

function logAudit(action,id){
auditLog.push({
action,
id,
timestamp:new Date().toISOString()
});
}

/* =========================
   LOGIN CHECK
========================= */

function checkID(){

const id=document.getElementById("idInput")
.value.trim().toUpperCase();

const member=members[id];

if(!member){
alert("Access Denied");
return;
}

if(member.disabled){
alert("Account temporarily suspended.");
return;
}

document.getElementById("memberName").textContent=member.name;
document.getElementById("memberID").textContent=id;
document.getElementById("serialTop").textContent=id;
document.getElementById("serialBottom").textContent=id;

document.querySelector(".card-info p")
.innerHTML="<strong>Title:</strong> "+member.title;

document.getElementById("centerBottom")
.textContent=member.bottomText||"MNSO";

document.getElementById("loginBox").style.display="none";
document.getElementById("idCard").style.display="block";

logAudit("login",id);
}

document.getElementById("idInput")
.addEventListener("keydown",e=>{
if(e.key==="Enter")checkID();
});

</script>

</body>
</html>
