<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MNSO Virtual ID Pass</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0a0f1a, #1c1c1c);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Pop-up security box */
    #loginBox {
      background: #111;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255,0,0,0.6);
    }
    #loginBox img {
      max-width: 80px;
      margin-bottom: 15px;
    }
    #loginBox input {
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      width: 180px;
      text-align: center;
      font-size: 16px;
    }
    #loginBox button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: red;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    #loginBox button:hover {
      background: darkred;
    }

    /* ID Card */
    #idCard {
      display: none;
      width: 420px;
      height: 260px;
      background: linear-gradient(135deg, #f5f5f0, #eae6dc);
      border-radius: 12px;
      border: 1.5px solid #444;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Watermark logo */
    #idCard::before {
      content: "";
      background: url("467CAA93-8809-4A02-AFA2-1749C9D78610.png") center/200px no-repeat;
      opacity: 0.08;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Top Title */
    .card-header {
      text-align: center;
      font-family: "Georgia", serif;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 2px;
      color: #1c1c1c;
      margin-bottom: 8px;
      border-bottom: 1px solid #444;
      padding-bottom: 3px;
      text-transform: uppercase;
    }

    /* Serial Numbers */
    .serial-number {
      position: absolute;
      top: 8px;
      left: 15px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      color: #444;
      letter-spacing: 1px;
    }
    .serial-number-bottom {
      position: absolute;
      bottom: 8px;
      right: 15px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      color: #444;
      letter-spacing: 1px;
    }

    /* Info Layout */
    .card-info {
      margin-top: 65px;
      margin-left: 110px;
      color: #111;
    }
    .card-info h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #000;
    }
    .card-info p {
      margin: 4px 0;
      font-size: 14px;
    }

    /* Adjust Logo + Seal */
    #idCard img.logo {
      position: absolute;
      top: 60px;
      left: 20px;
      width: 70px;
    }
    #idCard img.seal {
      position: absolute;
      top: 40px;
      right: 20px;
      width: 65px;
      opacity: 0.85;
    }

    /* Signature + QR */
    .signature {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-style: italic;
      font-size: 11px;
      color: #333;
    }
    .qr {
      position: absolute;
      bottom: 15px;
      right: 20px;
      width: 55px;
      height: 55px;
      background: white;
      border: 1px solid #999;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: black;
    }
  </style>
</head>
<body>

  <!-- Security Login -->
  <div id="loginBox">
    <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Modern Logo">
    <h2>MNSO Secure Access</h2>
    <p>Enter Your ID Number</p>
    <input type="password" id="idInput" placeholder="Enter ID">
    <br>
    <button onclick="checkID()">Access</button>
  </div>

  <!-- Virtual ID Card -->
  <div id="idCard">
    <div class="serial-number">A225C</div>
    <div class="card-header">The MNSO Organization</div>

    <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" class="logo" alt="MNSO Logo">
    <img src="7C60C8A7-1997-4A86-BC77-122697B82929.png" class="seal" alt="Chairman Seal">

    <div class="card-info">
      <h2>Jansen Monk</h2>
      <p><strong>Title:</strong> Chairman</p>
      <p><strong>ID Number:</strong> A225C</p>
      <p><strong>Expiration:</strong> 12/2026</p>
    </div>

    <div class="signature">Authorized by MNSO Chairman</div>
    <div class="qr">QR</div>
    <div class="serial-number-bottom">A225C</div>
  </div>

  <script>
    function checkID() {
      const input = document.getElementById("idInput").value;
      if (input === "A225C") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("idCard").style.display = "block";
      } else {
        alert("Access Denied");
      }
    }
  </script>

</body>
</html>
