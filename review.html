<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The MNSO Review</title>

  <!-- Serious newspaper fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --mnso-blue: #0b2a4a;
      --mnso-gold: #c9a24d;
      --light-gray: #f4f6f8;
    }

    body {
      margin: 0;
      background-color: var(--light-gray);
      font-family: "Inter", sans-serif;
      color: #111;
    }

    /* ===== Top Bar ===== */
    .top-bar {
      background-color: var(--mnso-blue);
      color: white;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 3px solid var(--mnso-gold);
    }

    .top-bar h1 {
      font-family: "Libre Baskerville", serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin: 0;
      text-transform: uppercase;
    }

    .top-bar img {
      height: 48px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .logo-left {
      left: 24px;
    }

    .seal-right {
      right: 24px;
    }

    /* ===== Layout ===== */
    .container {
      max-width: 1150px;
      margin: 44px auto;
      padding: 0 20px;
    }

    /* ===== Story Boxes ===== */
    .story-box {
      background-color: white;
      border: 1px solid #ddd;
      border-top: 4px solid var(--mnso-gold);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .story-box a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .story-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .story-title {
      padding: 18px;
      font-family: "Libre Baskerville", serif;
      font-size: 22px;
      font-weight: 700;
      border-top: 1px solid #eee;
      cursor: pointer;
    }

    .story-title:hover {
      text-decoration: underline;
    }

    /* ===== Featured Story ===== */
    .featured {
      margin-bottom: 44px;
    }

    .featured .story-image {
      height: 380px;
    }

    .featured .story-title {
      font-size: 30px;
    }

    /* ===== Secondary Stories ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .top-bar h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="top-bar">
    <img 
      src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" 
      alt="7C60C8A7-1997-4A86-BC77-122697B82929.png" 
      class="logo-left"
    >

    <h1>The MNSO Review</h1>

    <img 
      src="7C60C8A7-1997-4A86-BC77-122697B82929.png" 
      alt="Chairman Seal" 
      class="seal-right"
    >
  </header>

  <!-- ===== Content ===== -->
  <main class="container">

    <!-- ===== Featured Story ===== -->
    <section class="story-box featured">
      <a href="https://www.mnso.live">
        <img 
          src="467CAA93-8809-4A02-AFA2-1749C9D78610.png"
          alt="Featured Story"
          class="story-image"
        >
        <div class="story-title">
          Primary Headline of Major MNSO Coverage
        </div>
      </a>
    </section>

    <!-- ===== Secondary Stories ===== -->
    <section class="grid">

      <div class="story-box">
        <a href="https://www.mnso.live">
          <img 
            src="7C60C8A7-1997-4A86-BC77-122697B82929.png"
            alt="Story Image"
            class="story-image"
          >
          <div class="story-title">
            Secondary Story Headline
          </div>
        </a>
      </div>

      <div class="story-box">
        <a href="https://www.mnso.live">
          <img 
            src="7C60C8A7-1997-4A86-BC77-122697B82929.png"
            alt="Story Image"
            class="story-image"
          >
          <div class="story-title">
            Secondary Story Headline
          </div>
        </a>
      </div>

      <div class="story-box">
        <a href="https://www.mnso.live">
          <img 
            src="7C60C8A7-1997-4A86-BC77-122697B82929.png"
            alt="Story Image"
            class="story-image"
          >
          <div class="story-title">
            Secondary Story Headline
          </div>
        </a>
      </div>

    </section>

  </main>

</body>
</html>
