<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The MNSO Review</title>

  <!-- Google Font: Newspaper-style serif -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --mnso-blue: #0b2a4a;
      --mnso-gold: #c9a24d;
      --light-gray: #f4f6f8;
    }

    body {
      margin: 0;
      background-color: var(--light-gray);
      font-family: "Inter", sans-serif;
      color: #111;
    }

    /* ===== Top Bar ===== */
    .top-bar {
      background-color: var(--mnso-blue);
      color: white;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 3px solid var(--mnso-gold);
    }

    .top-bar h1 {
      font-family: "Playfair Display", serif;
      font-size: 32px;
      letter-spacing: 1px;
      margin: 0;
    }

    .top-bar img {
      height: 48px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .logo-left {
      left: 24px;
    }

    .seal-right {
      right: 24px;
    }

    /* ===== Layout ===== */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* ===== Story Boxes ===== */
    .story-box {
      background-color: white;
      border: 1px solid #ddd;
      border-top: 4px solid var(--mnso-gold);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .image-placeholder {
      width: 100%;
      height: 260px;
      background-color: #dbe2ea;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .story-title {
      padding: 16px;
      font-family: "Playfair Display", serif;
      font-size: 22px;
      border-top: 1px solid #eee;
    }

    /* ===== Featured Story ===== */
    .featured {
      margin-bottom: 40px;
    }

    .featured .image-placeholder {
      height: 360px;
      font-size: 16px;
    }

    .featured .story-title {
      font-size: 28px;
    }

    /* ===== Secondary Stories ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .top-bar h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-bar">
    <img src="mnso-logo.png" alt="MNSO Logo" class="logo-left">
    <h1>The MNSO Review</h1>
    <img src="chairman-seal.png" alt="Chairman Seal" class="seal-right">
  </header>

  <!-- Main Content -->
  <main class="container">

    <!-- Featured Story -->
    <section class="story-box featured">
      <div class="image-placeholder">
        Featured Story Image
      </div>
      <div class="story-title">
        Headline of the Primary MNSO Story Goes Here
      </div>
    </section>

    <!-- Secondary Stories -->
    <section class="grid">
      <div class="story-box">
        <div class="image-placeholder">Story Image</div>
        <div class="story-title">Secondary Story Headline</div>
      </div>

      <div class="story-box">
        <div class="image-placeholder">Story Image</div>
        <div class="story-title">Secondary Story Headline</div>
      </div>

      <div class="story-box">
        <div class="image-placeholder">Story Image</div>
        <div class="story-title">Secondary Story Headline</div>
      </div>
    </section>

  </main>

</body>
</html>
