<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MNSO Members Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: linear-gradient(to bottom, #001f3f, #0a0a0a);
  color: white;
  min-height: 100vh;
}

/* ===== TOP BAR ===== */
.top-bar {
  position: fixed;
  top: 0;
  width: 100%;
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  background: rgba(0, 31, 63, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  z-index: 1000;
}

.top-bar img {
  height: 52px;
}

.top-title {
  font-family: "Times New Roman", serif;
  font-size: 22px;
  letter-spacing: 0.6px;
}

/* ===== LOGIN ===== */
.login-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 150px;
}

.login-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 38px;
  width: 100%;
  max-width: 420px;
  border-radius: 10px;
  text-align: center;
}

.login-box h2 {
  font-family: "Times New Roman", serif;
  font-weight: normal;
  margin-bottom: 22px;
}

.login-box input {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  background: #0a0a0a;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  border-radius: 4px;
  font-size: 15px;
}

.login-box button {
  margin-top: 18px;
  padding: 14px;
  width: 100%;
  background: transparent;
  border: 2px solid #d4af37;
  color: white;
  font-family: "Times New Roman", serif;
  font-size: 17px;
  cursor: pointer;
  border-radius: 6px;
}

.login-box button:hover {
  background: #d4af37;
  color: black;
}

/* ===== PORTAL ===== */
.portal {
  display: none;
  padding-top: 140px;
  max-width: 900px;
  margin: auto;
  padding-left: 20px;
  padding-right: 20px;
}

.portal h1 {
  font-family: "Times New Roman", serif;
  font-weight: normal;
  margin-bottom: 24px;
}

.member-list {
  border-top: 1px solid rgba(255,255,255,0.25);
}

.member {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  font-size: 15px;
}

/* ===== ACTION BUTTONS ===== */
.portal-actions {
  margin-top: 40px;
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.portal-actions a {
  font-family: "Times New Roman", serif;
  font-size: 17px;
  padding: 14px 36px;
  border: 2px solid #d4af37;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  transition: all 0.3s ease;
}

.portal-actions a:hover {
  background: #d4af37;
  color: black;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .top-title { font-size: 18px; }
  .top-bar img { height: 46px; }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Logo">
  <div class="top-title">MNSO Organization</div>
  <img src="7C60C8A7-1997-4A86-BC77-122697B82929.png" alt="Chairman Seal">
</div>

<!-- LOGIN -->
<div class="login-wrapper" id="loginSection">
  <div class="login-box">
    <h2>Members Portal Login</h2>
    <input type="text" id="userId" placeholder="Member ID">
    <button onclick="login()">Authenticate</button>
    <p id="error" style="color:#ff6b6b; font-size:13px;"></p>
  </div>
</div>

<!-- PORTAL -->
<div class="portal" id="portal">
  <h1>Current Board Members Registry</h1>

  <div class="member-list">
    <div class="Chair"><span>Jansen Monk</span><span>A22A1</span></div>
    <div class="Data manager"><span>Janathe Nilsen.</span><span>A22A2</span></div>
    <div class="honorary chair"><span>Kendel Martin</span><span>A22A3</span></div>
    <div class="member"><span>Janathe L.</span><span>A22A4</span></div>
    <div class="member"><span>Jace McMillan</span><span>A22A5</span></div>
    <div class="member"><span>CFO</span><span>A22A6</span></div>
    <div class="member"><span>*unavailible</span><span>A22A7</span></div>
    <div class="member"><span>_____</span><span>A22A8</span></div>
  </div>

  <div class="portal-actions">
    <a href="https://www.mnso.live/kort">MNSO Legitimation Card</a>
    <a href="https://www.mnso.live/email">Admin Email Database</a>
  </div>
</div>

<script>
const validIDs = [
  "A22A1","A22A2","A22A3","A22A4",
  "A22A5","A22A6","A22A7","A22A8",
  "B22A1","B22A2"
];

function login() {
  const input = document.getElementById("userId").value.trim().toUpperCase();

  if (validIDs.includes(input)) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("portal").style.display = "block";
  } else {
    document.getElementById("error").textContent = "Invalid Member ID.";
  }
}
</script>

</body>
</html>
