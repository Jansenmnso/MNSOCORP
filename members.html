<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MNSO Members Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: linear-gradient(to bottom, #001f3f, #0a0a0a);
  color: white;
  min-height: 100vh;
}

/* ===== TOP BAR ===== */
.top-bar {
  position: fixed;
  top: 0;
  width: 100%;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: rgba(0, 31, 63, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  z-index: 1000;
}

.top-bar img {
  height: 42px;
}

.top-title {
  font-family: "Times New Roman", serif;
  font-size: 20px;
  letter-spacing: 0.6px;
}

/* ===== LOGIN ===== */
.login-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 140px;
}

.login-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 36px;
  width: 100%;
  max-width: 420px;
  border-radius: 10px;
  text-align: center;
}

.login-box h2 {
  font-family: "Times New Roman", serif;
  font-weight: normal;
  margin-bottom: 20px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  background: #0a0a0a;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  border-radius: 4px;
}

.login-box button {
  margin-top: 16px;
  padding: 12px;
  width: 100%;
  background: transparent;
  border: 2px solid #d4af37;
  color: white;
  font-family: "Times New Roman", serif;
  font-size: 16px;
  cursor: pointer;
  border-radius: 6px;
}

.login-box button:hover {
  background: #d4af37;
  color: black;
}

/* ===== PORTAL ===== */
.portal {
  display: none;
  padding-top: 120px;
  max-width: 900px;
  margin: auto;
  padding-left: 20px;
  padding-right: 20px;
}

.portal h1 {
  font-family: "Times New Roman", serif;
  font-weight: normal;
  margin-bottom: 20px;
}

.member-list {
  border-top: 1px solid rgba(255,255,255,0.2);
}

.member {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-size: 15px;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .top-title { font-size: 17px; }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Logo">
  <div class="top-title">MNSO Organization</div>
  <img src="chairman-seal.png" alt="Chairman Seal">
</div>

<!-- LOGIN -->
<div class="login-wrapper" id="loginSection">
  <div class="login-box">
    <h2>Members Portal Login</h2>
    <input type="text" id="userId" placeholder="Member ID">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Authenticate</button>
    <p id="error" style="color:#ff6b6b; font-size:13px;"></p>
  </div>
</div>

<!-- PORTAL -->
<div class="portal" id="portal">
  <h1>Authorized Members Registry</h1>

  <div class="member-list">
    <div class="member"><span>Jansen Monk</span><span>A22A1</span></div>
    <div class="member"><span>Krystal G.</span><span>A22A2</span></div>
    <div class="member"><span>Kendel Martin</span><span>A22A3</span></div>
    <div class="member"><span>Janathe L.</span><span>A22A4</span></div>
    <div class="member"><span>Reece Wsn.</span><span>A22A5</span></div>
    <div class="member"><span>Ross Lmb.</span><span>A22A6</span></div>
    <div class="member"><span>Horner Milton</span><span>A22A7</span></div>
    <div class="member"><span>Ella Shaw</span><span>A22A8</span></div>
  </div>
</div>

<script>
const validIDs = [
  "A22A1","A22A2","A22A3","A22A4",
  "A22A5","A22A6","A22A7","A22A8"
];

function login() {
  const id = document.getElementById("userId").value.trim();
  const pw = document.getElementById("password").value.trim();

  if (validIDs.includes(id) && pw === id) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("portal").style.display = "block";
  } else {
    document.getElementById("error").textContent = "Invalid credentials.";
  }
}
</script>

</body>
</html>
