<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CODE MIA – Emergency Protocol</title>
  <style>
    /* General reset and base styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: black;
      color: red;
    }

    /* Intro screen styles */
    #intro-screen {
      position: fixed;
      width: 100%;
      height: 100vh;
      background-color: black;
      animation: flashRed 1s infinite alternate;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
    }

    @keyframes flashRed {
      0% { background-color: black; }
      100% { background-color: #2b0000; }
    }

    .logo-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
    }

    .logo-wrapper img {
      width: 100%;
      height: auto;
      position: relative;
      z-index: 2;
    }

    .glow-circle {
      position: absolute;
      top: 0;
      left: 0;
      width: 180px;
      height: 180px;
      border: 5px solid red;
      border-radius: 50%;
      box-shadow: 0 0 20px red;
      animation: pulseGlow 2s linear infinite;
      z-index: 1;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px red; opacity: 0.6; }
      50% { box-shadow: 0 0 30px red; opacity: 1; }
      100% { box-shadow: 0 0 10px red; opacity: 0.6; }
    }

    /* Main content (hidden until intro is gone) */
    #main-content {
      display: none;
      padding: 30px;
      text-align: center;
    }

    .video-container {
      width: 90%;
      max-width: 800px;
      margin: 50px auto 30px;
      border: 3px solid red;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .alert-box {
      background-color: #1a1a1a;
      border: 2px solid red;
      color: #ff4d4d;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.6;
      border-radius: 10px;
      box-shadow: 0 0 10px red;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: gray;
    }
  </style>

  <script>
    // Hide intro screen after 5 seconds
    window.onload = function () {
      setTimeout(() => {
        document.getElementById("intro-screen").style.display = "none";
        document.getElementById("main-content").style.display = "block";
        document.getElementById("alertVideo").play(); // autoplay after transition
      }, 5000);
    };
  </script>
</head>
<body>

  <!-- Intro Splash Screen -->
  <div id="intro-screen">
    <div class="logo-wrapper">
      <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Logo">
      <div class="glow-circle"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content">
    <h1 style="font-size: 64px; margin-bottom: 10px;">CODE MIA</h1>
    <p style="font-size: 24px; margin-bottom: 40px;">This is not a drill</p>

    <div class="video-container">
      <video id="alertVideo" autoplay muted controls>
        <source src="CODE-MIA-ALERT.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="alert-box">
      <strong>🚨 CODE MIA ALERT</strong><br><br>
      This is NOT A DRILL.<br>
      Take all emergency precautions now!!<br>
      Listen to the broadcast immediately for more information.
    </div>

    <div class="footer">
      MNSO National Emergency Communications – Property of the MNSO Chairman's Office
    </div>
  </div>

</body>
</html>
