<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The MNSO Review</title>

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --mnso-blue: #0b2a4a;
      --mnso-gold: #c9a24d;
      --light-gray: #f4f6f8;
    }

    body {
      margin: 0;
      background-color: var(--light-gray);
      font-family: "Inter", sans-serif;
      color: #111;
    }

    .top-bar {
      background-color: var(--mnso-blue);
      color: white;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 3px solid var(--mnso-gold);
    }

    .top-bar h1 {
      font-family: "Libre Baskerville", serif;
      font-size: 34px;
      letter-spacing: 1.4px;
      margin: 0;
      text-transform: uppercase;
      text-align: center;
    }

    .top-bar img {
      height: 48px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .logo-left { left: 20px; }
    .seal-right { right: 20px; }

    .nav-bar {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 12px 0;
    }

    .nav-bar span {
      font-family: "Libre Baskerville", serif;
      font-weight: 700;
      color: var(--mnso-blue);
      letter-spacing: 0.8px;
      cursor: pointer;
    }

    .nav-bar span:hover {
      text-decoration: underline;
    }

    .local-time {
      text-align: center;
      margin: 16px 0 36px;
      font-family: "Libre Baskerville", serif;
      font-size: 14px;
      letter-spacing: 0.6px;
      color: #444;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto 44px;
      padding: 0 20px;
    }

    .story-box {
      background-color: white;
      border: 1px solid #ddd;
      border-top: 4px solid var(--mnso-gold);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .story-box a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .story-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .story-title {
      padding: 18px;
      font-family: "Libre Baskerville", serif;
      font-size: 22px;
      font-weight: 700;
      border-top: 1px solid #eee;
      cursor: pointer;
    }

    .story-title:hover {
      text-decoration: underline;
    }

    .featured {
      margin-bottom: 44px;
    }

    .featured .story-image {
      height: 380px;
    }

    .featured .story-title {
      font-size: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    @media (max-width: 900px) {
      .top-bar {
        height: auto;
        padding: 14px 0;
        flex-direction: column;
        gap: 8px;
      }

      .top-bar img {
        height: 34px;
        position: static;
        transform: none;
      }

      .top-bar h1 {
        font-size: 22px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" class="logo-left">
    <h1>The MNSO Review</h1>
    <img src="7C60C8A7-1997-4A86-BC77-122697B82929.png" class="seal-right">
  </header>

  <nav class="nav-bar">
    <span>Opinion</span>
    <span>Fact</span>
    <span>Discussion</span>
  </nav>

  <div class="local-time" id="localTime"></div>

  <main class="container">

    <!-- FEATURED (Article 1) -->
    <section class="story-box featured">
      <a href="https://www.mnso.live">
        <img src="PASTE_FEATURED_IMAGE_URL" class="story-image">
        <div class="story-title">
          Primary Headline of Major MNSO Coverage
        </div>
      </a>
    </section>

    <!-- GRID (Articles 2, 3, 4) -->
    <section class="grid">

      <!-- Article 2 -->
      <div class="story-box">
        <a href="https://www.mnso.live">
          <img src="PASTE_IMAGE_URL" class="story-image">
          <div class="story-title">Secondary Story Headline</div>
        </a>
      </div>

      <!-- Article 3 -->
      <div class="story-box">
        <a href="https://www.mnso.live">
          <img src="PASTE_IMAGE_URL" class="story-image">
          <div class="story-title">Secondary Story Headline</div>
        </a>
      </div>

      <!-- Article 4 (UPDATED) -->
      <div class="story-box">
        <a href="https://www.mnso.live">
          <img src="IMG_4830.jpeg" class="story-image">
          <div class="story-title">Easter Peace in a Time of Unrest</div>
        </a>
      </div>

    </section>

  </main>

  <script>
    function updateTime() {
      const now = new Date();
      document.getElementById("localTime").textContent =
        now.toLocaleString(undefined, {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>

</body>
</html>
