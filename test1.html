<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MNSO TEST MODE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ================= DEBUG CHECK ================= */

    body {
      margin: 0;
      font-family: Arial, sans-serif;

      /* STEP 1: FORCE VISUAL CONFIRMATION */
      background: red !important;
      color: white;
      text-align: center;
    }

    /* ================= HERO TEST ================= */

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .label {
      position: fixed;
      top: 10px;
      left: 10px;
      background: black;
      padding: 8px 12px;
      font-size: 12px;
      z-index: 9999;
    }

    /* ================= IMAGE TEST LAYER ================= */

    .skyline-test {
      position: absolute;
      inset: 0;

      /* STEP 2: REAL IMAGE */
      background-image:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.85)),
        url("IMG_1661.jpeg");

      background-size: cover;
      background-repeat: no-repeat;

      /* IMPORTANT TEST VALUE */
      background-position: center 90%;

      z-index: -1;
    }
  </style>
</head>

<body>

  <div class="label">
    MNSO DEBUG TEST — CHECK IF RED APPEARS FIRST
  </div>

  <div class="skyline-test"></div>

  <div class="hero">
    <h1>TEST HERO</h1>
    <p>
      If you can see this, CSS is loading correctly.<br>
      Next step: check if skyline appears instead of red.
    </p>
  </div>

</body>
</html>
