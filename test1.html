<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNSO Library</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
--mnso-blue:#0b2a4a;
--mnso-gold:#c9a24d;
--light-gray:#f4f6f8;
}

body{
margin:0;
background:var(--light-gray);
font-family:"Inter",sans-serif;
color:#111;
}

/* ================= HEADER ================= */

.top-bar{
background:var(--mnso-blue);
color:white;
height:86px;
display:flex;
align-items:center;
justify-content:center;
position:sticky;
top:0;
border-bottom:3px solid var(--mnso-gold);
}

.top-bar h1{
font-family:"Libre Baskerville",serif;
font-size:34px;
letter-spacing:1.4px;
margin:0;
text-transform:uppercase;
}

.top-bar img{
height:46px;
position:absolute;
top:50%;
transform:translateY(-50%);
}

.logo-left{ left:20px; }
.seal-right{ right:20px; }

/* ================= PAGE TITLE ================= */

.page-title{
text-align:center;
font-family:"Libre Baskerville",serif;
font-size:28px;
margin:30px 0 10px;
letter-spacing:.8px;
}

/* ================= MAIN BUTTONS ================= */

.top-buttons{
display:flex;
justify-content:center;
gap:22px;
margin:25px auto 40px;
flex-wrap:wrap;
}

.top-buttons a{
background:var(--mnso-blue);
color:white;
padding:12px 20px;
text-decoration:none;
border-radius:4px;
font-weight:500;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.top-buttons a:hover{
background:#143b63;
}

/* ================= LIBRARY CONTAINER ================= */

.library-container{
max-width:900px;
margin:0 auto 60px;
background:white;
border:1px solid #ddd;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
padding:25px 30px;
}

/* ================= SEARCH ================= */

.search-box{
width:100%;
padding:12px;
border:1px solid #ccc;
margin-bottom:25px;
font-size:15px;
}

/* ================= LINK LIST ================= */

.link-list{
max-height:420px;
overflow-y:auto;
}

.link-item{
margin:14px 0;
font-size:17px;
font-family:"Libre Baskerville",serif;
}

.link-item a{
color:#1a4fa3;
text-decoration:none;
border-bottom:1px solid #1a4fa3;
padding-bottom:1px;
}

.link-item a:hover{
opacity:.7;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

.top-bar{
height:auto;
padding:14px 0;
flex-direction:column;
}

.top-bar img{
position:static;
transform:none;
height:34px;
}

.top-bar h1{
font-size:22px;
}

.library-container{
margin:0 15px 40px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<header class="top-bar">

<img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" class="logo-left">

<h1>MNSO Library</h1>

<img src="7C60C8A7-1997-4A86-BC77-122697B82929.png" class="seal-right">

</header>

<h2 class="page-title">Modern Nonprofit Student Organization Archive</h2>

<!-- TOP BUTTONS -->

<div class="top-buttons">

<a href="https://www.mnso.live/contact">Contact</a>

<a href="https://www.mnso.live/directory">Elections Directory</a>

<a href="https://www.mnso.live/members">Members</a>

</div>

<!-- LIBRARY -->

<div class="library-container">

<input type="text" id="searchInput" class="search-box" placeholder="Search the MNSO Library...">

<div class="link-list" id="libraryList">

<div class="link-item">Election Archive: 
<a href="https://www.mnso.live/archive">www.mnso.live/archive</a>
</div>

<div class="link-item">Legitimization: 
<a href="https://www.mnso.live/kort">www.mnso.live/kort</a>
</div>

<div class="link-item">The Review: 
<a href="https://www.mnso.live/review">www.mnso.live/review</a>
</div>

<div class="link-item">Uncoated Podcast: 
<a href="https://www.mnso.live/uncoated">www.mnso.live/uncoated</a>
</div>

</div>

</div>

<script>

/* simple library search */

const searchInput = document.getElementById("searchInput");
const items = document.querySelectorAll(".link-item");

searchInput.addEventListener("keyup", function(){

let filter = searchInput.value.toLowerCase();

items.forEach(item => {

let text = item.textContent.toLowerCase();

item.style.display = text.includes(filter) ? "block" : "none";

});

});

</script>

</body>
</html>
