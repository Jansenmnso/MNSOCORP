<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory - MNSO</title>

  <style>
    body {
      margin: 0;
      background-color: white;
      color: black;
      font-family: Arial, sans-serif;
    }

    /* Logo styling */
    .logo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 100px;
      height: auto;
    }

    /* Container for the content */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      padding-bottom: 50px;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    /* Profile styling */
    .profile {
      background-color: #f1f1f1;
      border-radius: 10px;
      padding: 20px;
      width: 300px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .profile img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }

    .profile h2 {
      font-size: 22px;
      margin: 10px 0;
    }

    .profile p {
      font-size: 16px;
      color: #333;
    }

    /* Footer styling */
    .footer {
      text-align: center;
      font-size: 12px;
      color: gray;
      margin: 20px 0;
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Logo" class="logo">

  <!-- Main content container -->
  <div class="container">

    <h1>Our Youth Board Members</h1>

    <!-- Jansen Monk -->
    <div class="profile">
      <img src="IMG_7141.jpeg" alt="Jansen Monk"
           onerror="this.src='https://via.placeholder.com/300x400?text=Photo+Not+Found';">
      <h2>Jansen Monk</h2>
      <p>MNSO Youth Board Member</p>
    </div>

    <!-- Kendel Martin -->
    <div class="profile">
      <img src="IMG_8401.jpeg" alt="Kendel Martin"
           onerror="this.src='https://via.placeholder.com/300x400?text=Photo+Not+Found';">
      <h2>Kendel Martin</h2>
      <p>Second Chair</p>
    </div>

    <!-- Janathe Nilsen -->
    <div class="profile">
      <img src="IMG_2093.jpeg" alt="Janathe Nilsen"
           onerror="this.src='https://via.placeholder.com/300x400?text=Photo+Not+Found';">
      <h2>Janathe Nilsen</h2>
      <p>MNSO Data and Security Manager</p>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    MNSO Official Board Members<br>
    Houston, TX &amp; Norway
  </div>

</body>
</html>
