<!DOCTYPE html>
<html>
<head>
  <title>MNSO Docs</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>
</head>
<body>
  <h1>MNSO Secure Document System</h1>

  <!-- Login -->
  <div id="login">
    <p>Enter your MNSO ID:</p>
    <input type="text" id="userID" placeholder="Enter ID">
    <button onclick="login()">Login</button>
  </div>

  <!-- Document Dashboard -->
  <div id="dashboard" style="display:none;">
    <h2>Welcome to MNSO Docs</h2>

    <h3>Create New Document</h3>
    <input type="text" id="docTitle" placeholder="Document Title"><br><br>
    <textarea id="docContent" rows="10" cols="50" placeholder="Write your document..."></textarea><br>
    <button onclick="saveDoc()">Save Document</button>

    <h3>View Documents</h3>
    <ul id="docList"></ul>
  </div>

  <script>
    // Firebase setup
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app);

    let currentUserID = null;

    function login() {
      currentUserID = document.getElementById("userID").value.trim();
      if(currentUserID) {
        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadDocs();
      }
    }

    function saveDoc() {
      const title = document.getElementById("docTitle").value;
      const content = document.getElementById("docContent").value;

      db.collection("documents").add({
        title: title,
        content: content,
        authorID: currentUserID,
        timestamp: new Date()
      });
      alert("Document saved!");
      loadDocs();
    }

    function loadDocs() {
      const list = document.getElementById("docList");
      list.innerHTML = "";

      db.collection("documents").orderBy("timestamp", "desc").get().then(snapshot => {
        snapshot.forEach(doc => {
          let li = document.createElement("li");
          li.textContent = doc.data().title + " (by " + doc.data().authorID + ")";
          list.appendChild(li);
        });
      });
    }
  </script>
</body>
</html>
