<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MNSO Match Ticket</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#f4f6f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Ticket Card */

.ticket-card{
    width:380px;
    background:white;
    border-radius:28px;
    box-shadow:0 25px 60px rgba(0,0,0,0.12);
    padding:28px;
    position:relative;
}

/* Header */

.ticket-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    height:40px;
}

.ticket-title{
    font-weight:600;
    font-size:14px;
    letter-spacing:.6px;
    color:#111;
}

/* Match Info */

.match{
    text-align:center;
    margin-top:10px;
    margin-bottom:24px;
}

.match h1{
    margin:0;
    font-size:22px;
    font-weight:600;
}

.match p{
    margin:6px 0 0 0;
    font-size:14px;
    color:#6b7280;
}

/* Info grid */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:30px;
}

.info-box{
    background:#f7f9fc;
    padding:14px;
    border-radius:12px;
}

.info-label{
    font-size:11px;
    color:#6b7280;
    text-transform:uppercase;
    letter-spacing:.8px;
}

.info-value{
    margin-top:4px;
    font-weight:500;
    font-size:15px;
}

/* Activate button */

.activate-btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:14px;
    background:#0071e3;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:all .2s ease;
}

.activate-btn:hover{
    background:#005fcc;
}

/* Chairman seal */

.seal{
    position:absolute;
    bottom:20px;
    right:20px;
    opacity:.9;
}

.seal img{
    width:55px;
}

/* Modal */

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.65);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal img{
    max-width:90%;
    max-height:80%;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.close{
    position:absolute;
    top:28px;
    right:40px;
    font-size:34px;
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="ticket-card">

    <div class="ticket-header">

        <div class="logo">
            <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Logo">
        </div>

        <div class="ticket-title">MNSO Official Ticket</div>

    </div>

    <div class="match">
        <h1>Molde v Rosenborg</h1>
        <p>Aker Stadion • Official Entry Ticket</p>
    </div>

    <div class="info-grid">

        <div class="info-box">
            <div class="info-label">Ticket Holder</div>
            <div class="info-value">MNSO</div>
        </div>

        <div class="info-box">
            <div class="info-label">Seat</div>
            <div class="info-value">19 Q Nedre</div>
        </div>

    </div>

    <button class="activate-btn" onclick="activateTicket()">
        Activate Ticket
    </button>

    <div class="seal">
        <img src="chairman-seal.png">
    </div>

</div>

<!-- QR Ticket Modal -->

<div id="ticketModal" class="modal">

<span class="close" onclick="closeTicket()">&times;</span>

<img src="IMG_4373.jpeg" alt="Ticket QR">

</div>

<script>

function activateTicket(){
    document.getElementById("ticketModal").style.display="flex";
}

function closeTicket(){
    document.getElementById("ticketModal").style.display="none";
}

</script>

</body>
</html>
