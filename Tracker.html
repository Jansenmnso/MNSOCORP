<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MNSO Article Analytics</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: "Libre Baskerville", serif;
    background: #0b2a4a;
    color: #fff;
  }

  .header {
    padding: 24px;
    text-align: center;
    border-bottom: 3px solid #c9a24d;
  }

  .header h1 {
    margin: 0;
    letter-spacing: 2px;
    font-size: 28px;
  }

  .container {
    max-width: 900px;
    margin: 40px auto;
    background: white;
    color: black;
    padding: 24px;
    border-radius: 8px;
  }

  .card {
    border: 1px solid #ddd;
    border-top: 4px solid #c9a24d;
    padding: 16px;
  }

  .title {
    font-size: 20px;
    font-weight: 700;
  }

  .meta {
    margin-top: 10px;
    font-size: 14px;
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-top: 12px;
  }

  .stat {
    padding: 10px;
    background: #f4f6f8;
    border: 1px solid #ddd;
    flex: 1;
    text-align: center;
  }

  .btn {
    margin-top: 14px;
    display: inline-block;
    padding: 10px 14px;
    background: #0b2a4a;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-size: 14px;
  }

  .btn:hover {
    opacity: 0.85;
  }
</style>
</head>

<body>

<div class="header">
  <h1>MNSO INTERNAL ARTICLE TRACKER</h1>
</div>

<div class="container">

  <div class="card">
    <div class="title">Easter peace in a time of unrest</div>
    <div class="meta">Author: Ole H. Frostad</div>

    <div class="stats">
      <div class="stat">Views: 7</div>
      <div class="stat">Likes: 4</div>
    </div>

    <a class="btn" href="https://www.mnso.live/article4" target="_blank">
      Visit Article
    </a>
  </div>

</div>

</body>
</html>
