<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MNSO – Youth. Leadership. Change.</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom, #001f3f, #0a0a0a);
      color: white;
      font-family: 'Roboto', sans-serif;
      overflow-x: hidden;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
    }

    .language-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 14px;
      background-color: #002855;
      border: 1px solid white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      z-index: 10;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;     /* FIX */
      padding-top: 120px;   /* FIX */
      padding-bottom: 80px;
      text-align: center;
    }

    h1 {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .tabs {
      margin-bottom: 36px;
    }

    .tabs a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      border: 1px solid white;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .tabs a:hover {
      background-color: white;
      color: black;
    }

    .review-button {
      background-color: white;
      color: black;
      font-size: 20px;
      padding: 14px 38px;
      border-radius: 6px;
      border: 2px solid #c9a24d;
      font-family: "Times New Roman", Times, serif;
      letter-spacing: 1.6px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 0 3px rgba(201,162,77,0.25);
      transition: all 0.25s ease;
    }

    .review-button:hover {
      box-shadow: 0 0 0 4px rgba(201,162,77,0.45);
      transform: translateY(-1px);
    }

    .footer {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 12px;
      color: gray;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 44px;
      }

      .tabs a {
        display: inline-block;
        margin: 6px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Logo" class="logo">

  <div class="language-toggle" onclick="toggleLanguage()" id="langToggle">NO</div>

  <div class="container">
    <h1 id="mainTitle">MNSO</h1>

    <div class="tabs">
      <a href="directory.html" id="linkDirectory">Directory</a>
      <a href="contact.html" id="linkContact">Contact</a>
      <a href="members.html" id="linkMembers">Members</a>
      <a href="mnso-initiatives.html" id="linkDocs">Documents & Initiatives</a>
    </div>

    <a class="review-button" href="https://www.mnso.live/review" id="reviewBtn">
      The MNSO Review
    </a>
  </div>

  <div class="footer" id="footerText">
    classified website owned and operated by MNSO organization
  </div>

  <script>
    let isNorwegian = false;

    function toggleLanguage() {
      isNorwegian = !isNorwegian;
      document.getElementById("langToggle").textContent = isNorwegian ? "ENG" : "NO";
      document.getElementById("linkDirectory").textContent = isNorwegian ? "Katalog" : "Directory";
      document.getElementById("linkContact").textContent = isNorwegian ? "Kontakt" : "Contact";
      document.getElementById("linkMembers").textContent = isNorwegian ? "Medlemmer" : "Members";
      document.getElementById("linkDocs").textContent = isNorwegian ? "Dokumenter og Initiativer" : "Documents & Initiatives";
      document.getElementById("reviewBtn").textContent = isNorwegian ? "MNSO-REVIEWEN" : "The MNSO Review";
      document.getElementById("footerText").textContent = isNorwegian
        ? "klassifisert nettsted eid og drevet av MNSO-organisasjonen"
        : "classified website owned and operated by MNSO organization";
    }
  </script>

</body>
</html>
