<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MNSO – Youth. Leadership. Change.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #001f3f, #0a0a0a);
      color: white;
      font-family: 'Roboto', sans-serif;
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
      z-index: 10;
    }

    /* Language Toggle */
    .language-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 14px;
      background-color: #002855;
      border: 1px solid white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      z-index: 10;
    }

    /* Main Container */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    /* Review Button */
    .review-button {
      font-family: "Times New Roman", serif;
      font-size: 18px;
      background: transparent;
      color: white;
      border: 2px solid #d4af37;
      padding: 14px 36px;
      border-radius: 6px;
      margin-bottom: 35px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .review-button:hover {
      background-color: #d4af37;
      color: black;
    }

    /* Tabs */
    .tabs {
      margin-top: 10px;
    }

    .tabs a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      border: 1px solid white;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .tabs a:hover {
      background-color: white;
      color: black;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 12px;
      color: gray;
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 48px;
      }

      .review-button {
        font-size: 16px;
        padding: 12px 28px;
      }

      .tabs a {
        display: block;
        margin: 10px auto;
        width: fit-content;
      }
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Logo" class="logo">

  <!-- Language Toggle -->
  <div class="language-toggle" onclick="toggleLanguage()" id="langToggle">NO</div>

  <!-- Main Content -->
  <div class="container">
    <h1 id="mainTitle">MNSO</h1>

    <a
      class="review-button"
      href="https://www.mnso.live/review"
      id="reviewBtn"
    >
      The MNSO Review
    </a>

    <div class="tabs">
      <a href="directory.html" id="linkDirectory">Directory</a>
      <a href="contact.html" id="linkContact">Contact</a>
      <a href="members.html" id="linkMembers">Members</a>
      <a href="mnso-initiatives.html" id="linkDocs">Documents & Initiatives</a>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer" id="footerText">
    classified website owned and operated by MNSO organization
  </div>

  <!-- Language Toggle Script -->
  <script>
    let isNorwegian = false;

    function toggleLanguage() {
      isNorwegian = !isNorwegian;

      document.getElementById("langToggle").textContent = isNorwegian ? "ENG" : "NO";
      document.getElementById("mainTitle").textContent = "MNSO";

      document.getElementById("reviewBtn").textContent =
        isNorwegian ? "MNSO-gjennomgangen" : "The MNSO Review";

      document.getElementById("linkDirectory").textContent =
        isNorwegian ? "Katalog" : "Directory";

      document.getElementById("linkContact").textContent =
        isNorwegian ? "Kontakt" : "Contact";

      document.getElementById("linkMembers").textContent =
        isNorwegian ? "Medlemmer" : "Members";

      document.getElementById("linkDocs").textContent =
        isNorwegian ? "Dokumenter og Initiativer" : "Documents & Initiatives";

      document.getElementById("footerText").textContent = isNorwegian
        ? "klassifisert nettsted eid og drevet av MNSO-organisasjonen"
        : "classified website owned and operated by MNSO organization";
    }
  </script>

</body>
</html>
