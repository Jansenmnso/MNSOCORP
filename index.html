<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MNSO — Restricted Access</title>
  <style>
    body {
      margin: 0;
      background-color: #0b0b0b;
      color: #f5f5f5;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #ff3333;
      letter-spacing: 1px;
    }

    .notice {
      font-size: 18px;
      max-width: 600px;
      margin-bottom: 30px;
      color: #dddddd;
    }

    .status {
      background-color: #111;
      padding: 12px 25px;
      border: 2px solid #ff3333;
      border-radius: 6px;
      color: #ffcccc;
      font-weight: bold;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .contact {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }

    .contact a {
      color: #ff3333;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Official Crest -->
  <img src="467CAA93-8809-4A02-AFA2-1749C9D78610.png" alt="MNSO Official Crest" class="logo" />

  <h1>RESTRICTED ACCESS</h1>

  <div class="notice">
    The MNSO website is currently under scheduled maintenance or temporarily secured due to elevated activity.
    <br><br>
    Access is restricted. Please check back later.
  </div>

  <div class="status">SYSTEM STATUS: LOCKED</div>

  <div class="contact">
    For inquiries, contact the Office of Operations: <br>
    <a href="mailto:Jcompany366@gmail.com">Jcompany366@gmail.com</a>
  </div>

</body>
</html>
