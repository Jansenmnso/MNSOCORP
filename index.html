<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MNSO – Youth. Leadership. Change.</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #001f3f, #0a0a0a);
      color: white;
      font-family: 'Roboto', sans-serif;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
      height: auto;
    }

    .language-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 14px;
      background-color: #002855;
      border: 1px solid white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
      text-align: center;
    }

    h1 {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 40px;
      color: #ffffff;
    }

    .tabs {
      margin-bottom: 36px;
    }

    .tabs a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      border: 1px solid white;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .tabs a:hover {
      background-color: white;
      color: black;
    }

    /* ================= MNSO REVIEW BUTTON ================= */
    .review-button {
      background-color: #ffffff;
      color: #000000;
      font-size: 20px;
      padding: 14px 38px;
      border-radius: 6px;
      border: 2px solid #c9a24d; /* MNSO gold */
      font-family: "Times New Roman", Times, serif;
      font-weight: 400;
      letter-spacing: 1.6px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 0 3px rgba(201,162,77,0.25);
      transition: all 0.25s ease;
    }

    .review-button:hover {
      background-color: #f9f9f9;
      box-shadow: 0 0 0 4px rgba(201,162,77,0.45);
      transform: translateY(-1px);
    }

    .footer {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 12px;
      color: gray;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 44px;
      }

      .tabs a {
        font-size: 16px;
        margin: 6px;
        display: inline-block;
      }
    }
  </style>
</head>
